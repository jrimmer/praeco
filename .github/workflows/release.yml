# Builds static praeco binaries for x86_64 and aarch64 Linux and, for a version
# tag, creates a draft GitHub release with the binaries and their checksums,
# signs it with packslip (https://github.com/jdx/packslip), and only then
# publishes it. The release stays a draft until the signature is attached:
# praeco refuses an unsigned release of an app it has seen signed, so a public
# release without its signature would block every update until it appeared.
# Run it by hand (workflow_dispatch) to build and test without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      ASSET: praeco-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml says $v but the tag is $GITHUB_REF_NAME"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        run: |
          mkdir dist
          cp "target/$TARGET/release/praeco" "dist/$ASSET"
          cd dist
          file "$ASSET"
          file "$ASSET" | grep -Eq 'statically linked|static-pie linked' || { echo "not a static binary"; exit 1; }
          "./$ASSET" --version
          sha256sum "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          cat >> notes.md <<NOTES

          ## Install

          Static binaries for x86_64 and aarch64 Linux, each with a \`.sha256\` file; \`SHA256SUMS\` lists both.
          \`packslip.sigstore.json\` is the signed manifest of both binaries.
          Apps ship praeco in their own packages: see [Shipping praeco with your app](https://github.com/jrimmer/praeco#shipping-praeco-with-your-app).
          Rust apps can use the crate instead: \`cargo add praeco@$v\`.
          NOTES
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat praeco-linux-*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "praeco ${GITHUB_REF_NAME#v}" --notes-file ../notes.md \
            praeco-linux-* SHA256SUMS

  # Sign the release. packslip describes the binaries in one statement and
  # signs it with this workflow's identity, so there is no key to keep. The
  # signing job only reads the build artifacts (the release is still a draft, so
  # it could not read it anyway); the job after it holds the write permission,
  # uploads the bundle and publishes the release. If signing fails, the release
  # stays a draft and nothing reaches users. The action is pinned to a commit
  # because its code decides what gets signed.
  packslip:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        id: packslip
        with:
          artifacts: dist/praeco-linux-x86_64 dist/praeco-linux-aarch64
          bin: praeco
          upload: false

      - uses: actions/upload-artifact@v4
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish:
    needs: packslip
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packslip-bundle
          path: packslip

      - name: Attach the signed bundle and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
