[package]
name = "praeco"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Update checks and in-place updates for Linux desktop apps released on GitHub or Forgejo"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jrimmer/praeco"
keywords = ["update", "updater", "self-update", "linux", "desktop"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = [".github/"]

[lib]
name = "praeco"
path = "src/lib.rs"

[[bin]]
name = "praeco"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
tempfile = "3"
tar = "0.4"
flate2 = "1"

[profile.release]
lto = true
strip = true
