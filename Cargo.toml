[package]
name = "praeco"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared update library and CLI for Linux desktop apps"
license = "MIT"
readme = "README.md"

[lib]
name = "praeco"
path = "src/lib.rs"

[[bin]]
name = "praeco"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
tempfile = "3"
tar = "0.4"
flate2 = "1"

[profile.release]
lto = true
strip = true
